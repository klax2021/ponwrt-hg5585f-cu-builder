name: Upstream Release Digest (Telegram)

on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:

concurrency:
  group: upstream-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    name: 推送编译基线之后的上游更新
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout 私有仓库（读取编译基线）
        uses: actions/checkout@v4

      - name: 读取编译基线
        id: base
        run: |
          TAG=""
          SHAI=""
          BTIME=""
          [ -f build-base-release.txt ] && TAG=$(tr -d '[:space:]' < build-base-release.txt)
          [ -f last-built-sha.txt ] && SHAI=$(tr -d '[:space:]' < last-built-sha.txt)
          [ -f build-time.txt ] && BTIME=$(cat build-time.txt)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "sha=$SHAI" >> $GITHUB_OUTPUT
          echo "btime=$BTIME" >> $GITHUB_OUTPUT
          echo "编译基线 Release: ${TAG:-（无）} @ ${SHAI:-（无）} / ${BTIME:-（无时间）}"

      - name: 拉取上游 Release 并算增量、生成推送
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BASE_TAG: ${{ steps.base.outputs.tag }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BUILD_TIME: ${{ steps.base.outputs.btime }}
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request

          API = "https://api.github.com/repos/wuziwei/ponwrt-ZN504-HG5585F/releases?per_page=100"
          req = urllib.request.Request(API, headers={"User-Agent": "ponwrt-digest", "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              releases = [r for r in json.load(resp) if not r.get("draft")]

          base_tag = os.environ.get("BASE_TAG", "").strip()
          base_sha = os.environ.get("BASE_SHA", "").strip()
          btime = os.environ.get("BUILD_TIME", "").strip()

          # releases 按 published_at 倒序。基线 tag 定位：找到它，取比它新的（列表里在它之前的）
          idx = next((i for i, r in enumerate(releases) if r["tag_name"] == base_tag), None)
          no_baseline = False
          if base_tag and idx is not None:
              fresh = releases[:idx]
          elif not base_tag:
              # 无基线（尚未编译或首编未记录）：推最新 1 个作参考
              fresh = releases[:1]
              no_baseline = True
          else:
              # 基线存在但不在列表内（太久远），推最近 3 个，避免漏报
              fresh = releases[:3]
              no_baseline = True

          def clean_md(text):
              lines = []
              for raw in (text or "").splitlines():
                  s = raw.rstrip()
                  m = re.match(r'^(#{1,6})\s+(.*)$', s)
                  if m:
                      level, title = len(m.group(1)), m.group(2)
                      title = re.sub(r'\*\*|`', '', title)
                      lines.append(("【" + title + "】") if level <= 2 else ("▸ " + title))
                      lines.append("")
                      continue
                  if not s.strip():
                      if lines and lines[-1] != "":
                          lines.append("")
                      continue
                  s = re.sub(r'^(\s*)[-*+]\s+', lambda m: '    · ' if len(m.group(1)) >= 2 else '• ', s)
                  s = s.replace('**', '').replace('`', '')
                  s = re.sub(r'\[([^\]]+)\]\([^)]+\)', r'\1', s)
                  lines.append(s)
              return "\n".join(lines).strip()

          def send(text):
              payload = json.dumps({
                  "chat_id": os.environ["CHAT_ID"],
                  "text": text,
                  "disable_web_page_preview": True
              }).encode("utf-8")
              url = f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage"
              req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
              if not result.get("ok"):
                  raise SystemExit(f"Telegram 推送失败: {result}")

          base_label = base_tag or base_sha or "未知基线"
          note = "\n⚠️ 尚未记录编译基线，请先手动触发一次编译以建立基线；以上供参考。" if no_baseline else ""
          if not fresh:
              send(f"📦 PonWrt 上游自你编译的版本（{base_label}）以来暂无新 Release，固件无需重编。")
              print("无新增 Release")
          else:
              # 期间版本号清单（旧→新）
              version_list = " → ".join(r["tag_name"] for r in reversed(fresh))
              # 只推最新那一个 Release 的正文（作者正文为累计式，已覆盖期间变化）
              latest = fresh[0]
              body = clean_md(latest.get("body", ""))
              header = (
                  f"🆕 上游有新版本（自你编译 {base_label} 起，共 {len(fresh)} 个更新）\n"
                  f"期间版本：{version_list}\n"
                  f"{'─' * 18}\n"
              )
              footer = f"\n{'─' * 18}\n🔗 {latest.get('html_url','')}\n（以下为作者最新一版说明，累计覆盖期间变化）" + note
              full = header + body + footer
              if len(full) > 3900:
                  full = header + body[:3900 - len(header) - len(footer)] + "…（全文见链接）" + footer
              send(full)
              print("已推送最新 Release:", latest["tag_name"], "| 期间共", len(fresh), "个版本")
          PY
