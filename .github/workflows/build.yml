name: Weekly Check & Build HG5585F-CU

on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制编译（忽略是否有更新）'
        type: boolean
        default: true
      clean_ccache:
        description: '清空 Ccache 后全新编译（内核大改时勾选）'
        type: boolean
        default: false

concurrency:
  group: ponwrt-cu-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_MAXSIZE: 5G

jobs:
  check:
    name: 检查上游 README Changelog 是否有更新
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_update: ${{ steps.chk.outputs.has_update }}
      new_ver: ${{ steps.chk.outputs.new_ver }}
      changelog: ${{ steps.chk.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析 Changelog 并与编译基线比对
        id: chk
        run: |
          curl -fsSL "https://raw.githubusercontent.com/wuziwei/ponwrt-ZN504-HG5585F/master/README.md" -o README.md
          python3 - <<'PY'
          import re, os
          text = open('README.md', encoding='utf-8').read()
          m = re.search(r'^##\s+.*Changelog.*$', text, re.M | re.I)
          if not m:
              print('::error::未找到 Changelog 章节')
              raise SystemExit(1)
          sec = text[m.start():]
          nxt = re.search(r'^##\s+', sec[5:], re.M)
          if nxt:
              sec = sec[:nxt.start()+5]
          vm = re.search(r'v\d{4}\.\d{2}\.\d{2}-\d{4}', sec)
          new_ver = vm.group() if vm else ''
          base = ''
          if os.path.exists('build-base-release.txt'):
              base = open('build-base-release.txt', encoding='utf-8').read().strip()
          has = 'true' if new_ver and new_ver != base else 'false'
          print('最新版本:', new_ver, '| 基线:', base or '(无)', '| 有更新:', has)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'new_ver={new_ver}\n')
              f.write(f'has_update={has}\n')
              f.write('changelog<<__CLG_END__\n')
              f.write(sec.strip()+'\n')
              f.write('__CLG_END__\n')
          PY

  no_update:
    name: 无更新提示
    needs: check
    if: needs.check.outputs.has_update != 'true' && inputs.force_build != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 推送无更新提示
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEW_VER: ${{ needs.check.outputs.new_ver }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          text = f"📦 PonWrt 本周无新版本（上游当前 {os.environ['NEW_VER'] or '未知'}），固件无需重编。"
          payload = json.dumps({"chat_id": os.environ["CHAT_ID"], "text": text}).encode("utf-8")
          url = f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage"
          req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as r:
              res = json.loads(r.read().decode("utf-8"))
          if not res.get("ok"):
              raise SystemExit(f"推送失败: {res}")
          print("已推送无更新提示")
          PY

  build:
    name: Build fiberhome_hg5585f-cu
    needs: check
    if: needs.check.outputs.has_update == 'true' || inputs.force_build == true
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout 私有配置仓库
        uses: actions/checkout@v4

      - name: 清理磁盘释放空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          echo "=== [磁盘] 清理后 ==="
          df -h /

      - name: 安装编译与 BTF (pahole) 依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full pahole patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd zip
          pahole --version

      - name: 拉取 wuziwei 最新 master 源码
        run: |
          git clone --depth=1 https://github.com/wuziwei/ponwrt-ZN504-HG5585F.git openwrt
          cd openwrt
          echo "UPSTREAM_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "UPSTREAM_MSG=$(git log -1 --pretty=%s)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      - name: 恢复 dl 下载缓存
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ponwrt-cu-dl-${{ hashFiles('openwrt/feeds.conf.default', 'openwrt/configs/*.config') }}
          restore-keys: |
            ponwrt-cu-dl-

      - name: 恢复编译器 Ccache 缓存
        if: ${{ !inputs.clean_ccache }}
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ponwrt-cu-ccache-${{ env.UPSTREAM_SHA }}
          restore-keys: |
            ponwrt-cu-ccache-

      - name: 更新 Feeds 并执行上游定制脚本
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash ./scripts/customize.sh

      - name: 生成 CU 单机型 .config（收敛设备 + 剥离应用 + 保留 BTF）
        working-directory: openwrt
        run: |
          ./scripts/kconfig.pl + \
            configs/an7581.config \
            configs/release.config > .config

          # 1) 剥离 Honk / Tailscale 及其专属 LuCI / i18n / 依赖（用户态应用改为后装，避免 Rust/Go 工具链入编译链）
          for p in honk luci-app-honk luci-lib-daeuniverse luci-i18n-daeuniverse-zh-cn \
                   tailscale luci-app-tailscale-community luci-i18n-tailscale-community-zh-cn \
                   v2ray-geoip v2ray-geosite; do
            sed -i "s/^CONFIG_PACKAGE_${p}=y/# CONFIG_PACKAGE_${p} is not set/" .config
          done

          # 2) 收敛设备：只保留 HG5585F-CU，关闭其余所有 TARGET_DEVICE（含 usb-sfp 变体）
          for dev in $(grep -oP '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\K[A-Za-z0-9_.-]+(?==y)' .config); do
            case "$dev" in
              fiberhome_hg5585f-cu) ;;
              *) sed -i "s/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${dev}=y/# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${dev} is not set/" .config ;;
            esac
          done

          # 3) 关闭 Nokia 专用 U-Boot 变体（CU 不需要）
          sed -i 's/^CONFIG_PACKAGE_u-boot-an7581_nokia_xg-040g-md=y/# CONFIG_PACKAGE_u-boot-an7581_nokia_xg-040g-md is not set/' .config

          # 4) BTF/eBPF：先移除所有相关旧行，再统一显式写入（避免 sed 删行后落到 Kconfig 默认值）
          sed -i '/^CONFIG_KERNEL_DEBUG_INFO/d; /^# CONFIG_KERNEL_DEBUG_INFO/d' .config
          cat >> .config <<'EOF'
          CONFIG_KERNEL_DEBUG_INFO=y
          # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y
          CONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH=y
          CONFIG_KERNEL_KPROBES=y
          CONFIG_KERNEL_BPF_EVENTS=y
          EOF

          # 5) Ccache（clean_ccache=true 时完全关闭）
          if [ "${{ inputs.clean_ccache }}" != "true" ]; then
            sed -i '/^CONFIG_DEVEL=/d; /^CONFIG_CCACHE=/d' .config
            printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\n' >> .config
          fi

          make defconfig

      - name: 硬校验（不合格立即中止，不带错编译）
        working-directory: openwrt
        run: |
          set -e
          fail=0
          chk() { if eval "$1"; then echo "  OK   $2"; else echo "  FAIL $2"; fail=1; fi; }

          echo "=== defconfig 后实际选中的设备 ==="
          grep '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config || true
          echo "=== 机型 / eBPF / BTF ==="
          grep -E 'DEBUG_INFO_BTF|BPF_EVENTS|DEBUG_INFO_REDUCED|DEBUG_INFO=' .config || true
          echo "=== 931 IPv6 PPE 补丁 ==="
          find target/linux/airoha -name '*931*ipv6*pppoe*' -print

          echo "=== 校验闸门 ==="
          # 1) CU 必须选中
          chk "grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-cu=y' .config" "CU 设备已选中"
          # 2) 只能有 CU 一个设备（防止 defconfig 把其它设备选回来）
          dev_count=$(grep -c '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y' .config || true)
          chk "[ "$dev_count" -eq 1 ]" "仅 CU 单机型（当前 $dev_count 个设备）"
          # 3) 精简调试信息必须关闭（BTF 的硬性前提）
          chk "grep -q '^# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' .config" "精简调试信息已关闭"
          # 4) BTF / BPF 三件套齐全
          chk "grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config" "BTF 已启用"
          chk "grep -q '^CONFIG_KERNEL_BPF_EVENTS=y' .config" "BPF_EVENTS 已启用"
          # 5) Honk / Tailscale 必须未选中
          chk "! grep -qE '^CONFIG_PACKAGE_(honk|tailscale|luci-app-honk|luci-app-tailscale-community)=y' .config" "Honk/Tailscale 已剥离"

          if [ "$fail" -ne 0 ]; then
            echo "::error::配置硬校验未通过，中止编译（详见上方 FAIL 项）"
            exit 1
          fi
          echo "全部校验通过，开始下载与编译"

      - name: 预下载依赖包
        working-directory: openwrt
        run: |
          echo "=== [磁盘] 下载前 ==="
          df -h /
          make download -j"$(nproc)"
          find dl -size -1024c -exec rm -f {} \;
          echo "=== [磁盘] 下载后 ==="
          df -h /

      - name: 开始编译固件
        working-directory: openwrt
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          echo "=== [磁盘] 编译前 ==="
          df -h /
          mkdir -p "$CCACHE_DIR"
          [ -x staging_dir/host/bin/ccache ] && staging_dir/host/bin/ccache -z || true
          # 单次编译：失败直接退出，不在磁盘耗尽时空转重编（满盘重试只会雪上加霜）
          make -j"$(nproc)"
          echo "=== [磁盘] 编译后 ==="
          df -h /
          [ -x staging_dir/host/bin/ccache ] && staging_dir/host/bin/ccache -s || true

      - name: 保存编译器 Ccache 缓存
        if: always() && ${{ !inputs.clean_ccache }}
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ponwrt-cu-ccache-${{ env.UPSTREAM_SHA }}

      - name: 收集联通版固件产物
        working-directory: openwrt
        run: |
          mkdir -p output
          find bin/targets/airoha/an7581/ -type f \
            -name '*hg5585f-cu*squashfs-sysupgrade.itb' \
            ! -name '*usb-sfp*' -exec cp {} output/ \;
          cd output
          for file in $(ls * 2>/dev/null); do
            [ -f "$file" ] && sha256sum "$file" > "${file}.sha256"
          done
          echo "=== 联通版固件产物 ==="
          ls -lh
          test -n "$(ls *squashfs-sysupgrade.itb 2>/dev/null)" || { echo "未找到 CU 固件产物"; exit 1; }
          echo "FW_PATH=$PWD/$(ls *squashfs-sysupgrade.itb | head -1)" >> $GITHUB_ENV

      - name: 上传固件为 Artifact（供推送 job 使用）
        uses: actions/upload-artifact@v4
        with:
          name: cu-firmware
          path: openwrt/output/*
          retention-days: 7

      - name: 记录本次编译基线
        run: |
          echo "${{ needs.check.outputs.new_ver }}" > build-base-release.txt
          echo "${{ env.UPSTREAM_SHA }}" > last-built-sha.txt
          echo "${{ env.UPSTREAM_MSG }}" > last-built-msg.txt
          echo "${{ env.BUILD_TIME }}" > build-time.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-base-release.txt last-built-sha.txt last-built-msg.txt build-time.txt
          git commit -m "chore: build baseline ${{ needs.check.outputs.new_ver }} @ ${{ env.UPSTREAM_SHA }} [skip ci]" || echo "no changes"
          git push origin HEAD:master

  notify:
    name: 推送固件与更新日志到 Telegram
    needs: [check, build]
    if: needs.check.outputs.has_update == 'true' || inputs.force_build == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 下载固件 Artifact
        uses: actions/download-artifact@v4
        with:
          name: cu-firmware
          path: firmware

      - name: 推送更新日志 + 固件附件
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEW_VER: ${{ needs.check.outputs.new_ver }}
          CHANGELOG: ${{ needs.check.outputs.changelog }}
        run: |
          python3 - <<'PY'
          import os, re, json, glob, subprocess, urllib.request

          CHAT_ID = os.environ["CHAT_ID"]
          TOKEN = os.environ["BOT_TOKEN"]
          NEW_VER = os.environ.get("NEW_VER", "")
          API = f"https://api.telegram.org/bot{TOKEN}"
          MAX = 48 * 1024 * 1024  # 留 2MB 安全余量（官方上限 50MB）

          def api(method, payload):
              req = urllib.request.Request(API + "/" + method,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  res = json.loads(r.read().decode("utf-8"))
              if not res.get("ok"):
                  raise SystemExit(f"{method} 失败: {res}")
              return res

          def send_text(text):
              api("sendMessage", {"chat_id": CHAT_ID, "text": text, "disable_web_page_preview": True})

          def send_doc(path, caption=""):
              boundary = "----ponwrt" + os.urandom(8).hex()
              body = b""
              for k, v in (("chat_id", CHAT_ID), ("caption", caption)):
                  body += (f"--{boundary}\r\nContent-Disposition: form-data; name=\"{k}\"\r\n\r\n{v}\r\n").encode("utf-8")
              name = os.path.basename(path)
              body += (f"--{boundary}\r\nContent-Disposition: form-data; name=\"document\"; filename=\"{name}\"\r\nContent-Type: application/octet-stream\r\n\r\n").encode("utf-8")
              with open(path, "rb") as f:
                  body += f.read()
              body += f"\r\n--{boundary}--\r\n".encode("utf-8")
              req = urllib.request.Request(API + "/sendDocument", data=body,
                  headers={"Content-Type": f"multipart/form-data; boundary={boundary}"})
              with urllib.request.urlopen(req, timeout=300) as r:
                  res = json.loads(r.read().decode("utf-8"))
              if not res.get("ok"):
                  raise SystemExit(f"sendDocument 失败: {res}")

          def clean_md(text):
              out = []
              for raw in (text or "").splitlines():
                  s = raw.rstrip()
                  if not s.strip() or re.fullmatch(r'[\s*_\-]+', s):
                      continue
                  if re.fullmatch(r'\[\]\([^)]+\)', s):
                      continue
                  m = re.match(r'^(#{1,6})\s+(.*)$', s)
                  if m:
                      t = re.sub(r'\*\*|`', '', m.group(2))
                      out.append("【" + t + "】" if len(m.group(1)) <= 3 else "▸ " + t)
                      out.append("")
                      continue
                  s = re.sub(r'^(\s*)[-*+]\s+', lambda m: '    · ' if len(m.group(1)) >= 2 else '• ', s)
                  s = re.sub(r'^(\s*)(\d+)\.\s+', lambda m: m.group(1) + m.group(2) + '. ', s)
                  s = s.replace('**', '').replace('`', '')
                  s = re.sub(r'\[([^\]]+)\]\([^)]+\)', r'\1', s)
                  out.append(s)
              return "\n".join(out).strip()

          log = clean_md(os.environ.get("CHANGELOG", ""))
          header = f"🆕 上游更新 {NEW_VER}\n（自上次编译以来的变化，来源：上游 README Changelog）\n{'─' * 18}\n"
          log_text = header + log
          if len(log_text) > 3900:
              log_text = log_text[:3900] + "\n…（全文见上游 README）"
          send_text(log_text)
          print("更新日志已推送")

          fw = sorted(glob.glob("firmware/*squashfs-sysupgrade.itb"))
          if not fw:
              raise SystemExit("未找到固件 itb")
          path = fw[0]
          size = os.path.getsize(path)
          print("固件大小:", size, "bytes")

          if size <= MAX:
              send_doc(path, f"HG5585F-CU 联通版固件 {NEW_VER}（{size//1024//1024}MB）")
              print("固件直发成功")
          else:
              subprocess.run(["zip", "-9", "-j", "fw.zip", path], check=True)
              zsize = os.path.getsize("fw.zip")
              print("zip 压缩后:", zsize, "bytes")
              if zsize <= MAX:
                  send_doc("fw.zip", f"HG5585F-CU 固件 {NEW_VER}（zip 压缩 {zsize//1024//1024}MB）\n解压得 squashfs-sysupgrade.itb")
                  print("固件 zip 发送成功")
              else:
                  subprocess.run(["split", "-b", "45m", "-d", "-a", "2", "fw.zip", "fw.zip.part"], check=True)
                  parts = sorted(glob.glob("fw.zip.part*"))
                  send_text(f"📦 固件 {NEW_VER} 超过 Telegram 单文件 50MB 上限，已拆为 {len(parts)} 个分卷，随后逐个发送。\n合并命令：cat fw.zip.part* > fw.zip && unzip fw.zip")
                  for i, p in enumerate(parts, 1):
                      send_doc(p, f"分卷 {i}/{len(parts)} - {NEW_VER}")
                  print("固件分卷发送完成，共", len(parts), "卷")
          PY
